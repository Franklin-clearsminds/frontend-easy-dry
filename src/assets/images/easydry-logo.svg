<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Background Badge / Droplet Container -->
  <g transform="translate(10, 10)">
    <!-- Outer Lime Leaf Ring -->
    <path d="M 50 10 C 25 10 5 30 5 55 C 5 80 25 100 50 100 C 75 100 95 80 95 55 C 95 30 75 10 50 10 Z" fill="#9BCB3B" />
    <!-- Inner Water Droplet (Blue & Silver Gradient) -->
    <path d="M 50 20 C 50 20 28 55 28 70 C 28 83 38 93 50 93 C 62 93 72 83 72 70 C 72 55 50 20 50 20 Z" fill="url(#dropGrad)" />
  </g>

  <!-- Typography: easy -->
  <text x="120" y="78" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="54" fill="#FFFFFF" letter-spacing="-1">easy</text>
  
  <!-- Typography: dry -->
  <text x="235" y="78" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="54" fill="#9BCB3B" letter-spacing="-1">dry</text>
  
  <!-- Registered Mark -->
  <text x="325" y="42" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#B2E040">®</text>

  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36699B" />
      <stop offset="50%" stop-color="#004282" />
      <stop offset="100%" stop-color="#002952" />
    </linearGradient>
  </defs>
</svg>
